<style>
/* ============================================================================
   Wallet page — Midnight Neon.
   The palette, spacing and type below mirror dashboard.css so the whole site
   reads as one instrument. The block of alias names at the end of :root is the
   set this page's own rules and its script still name in inline styles; they
   are re-pointed, never removed, or those inline styles would silently break.
   The page previously carried a separate "private bank" identity (serif
   display face, gold, crest, glass blur); that is retired here.
   ========================================================================= */
:root{
  /* ---- palette: identical values to dashboard.css ---------------------- */
  --bg:#080D18; --card:#111A2B; --raised:#152137; --rule:#24364C;
  --ink:#EDF4FF; --muted:#9AAFCA; --bright:#FFFFFF; --faint:#6E85A6;
  --cyan:#29D9FF; --violet:#8B5CFF;
  --pos:#35E6A1; --warn:#FFB547; --neg:#FF667A;
  --cyan-dim:rgba(41,217,255,.12); --violet-dim:rgba(139,92,255,.14);
  --pos-dim:rgba(53,230,161,.12); --warn-dim:rgba(255,181,71,.13); --neg-dim:rgba(255,102,122,.12);
  --rule-soft:#1B2A3E;
  --paper:var(--bg); --surface:var(--raised);
  --shadow:rgba(2,6,14,.55);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-card:12px; --r-ctl:8px; --r-pill:999px;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;

  /* ---- names the older rules and the page script still use ------------- */
  --font-sans:var(--sans); --font-mono:var(--mono); --font-serif:var(--sans);
  --glass:rgba(41,217,255,.04); --glass-strong:rgba(41,217,255,.07); --glass-border:var(--rule);
  /* gold was the primary accent; cyan carries it now */
  --gold:var(--cyan); --gold-2:var(--cyan); --gold-soft:var(--cyan-dim); --gold-line:rgba(41,217,255,.34);
  --glow-gold:rgba(41,217,255,.10);      /* glow retired: small status marks only */
  --cyan-soft:var(--cyan-dim); --cyan-line:rgba(41,217,255,.34);
  --green:var(--pos); --green-soft:var(--pos-dim); --green-line:rgba(53,230,161,.32);
  --red:var(--neg); --red-soft:var(--neg-dim); --red-line:rgba(255,102,122,.34);
  --border:var(--rule);
  --bg2:var(--card); --bg3:var(--raised);
  --text:var(--ink); --text2:var(--muted); --text3:var(--faint);
  --green-dim:var(--pos-dim); --red-dim:var(--neg-dim); --gold-dim:var(--cyan-dim);
  --blue:var(--cyan); --blue-dim:var(--cyan-dim);
  --live:var(--pos); --edge:var(--neg); --idle:#5F7593;
}

/* ---- page chrome -------------------------------------------------------- */
/* The site header is dashboard.css's. On this page it carries only the brand
   and the nav (there is no wallet picker or Collect button here), so keep the
   two together and let them wrap rather than being pushed to opposite edges. */
body header.topbar{flex-wrap:wrap;justify-content:flex-start;gap:var(--s4) var(--s5);row-gap:var(--s2)}
body header.topbar .pages{margin-right:0}

.subtitle{color:var(--muted);font-size:13px;margin:var(--s4) 0 0;max-width:80ch}

/* Tabs read as one control strip sitting on a rule, the active one underlined. */
.tabs{display:flex;gap:var(--s1);flex-wrap:wrap;margin:var(--s5) 0 var(--s5);border-bottom:1px solid var(--rule)}
.tabs a{
  font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:9px 14px;
  border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:var(--r-ctl) var(--r-ctl) 0 0;
  transition:color .15s,background .15s,border-color .15s;
}
.tabs a:hover{color:var(--ink);background:var(--raised)}
.tabs a.here{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab[hidden]{display:none!important}
select,option{color-scheme:dark}
.tab select option{background:var(--raised);color:var(--ink)}
.tab .mono,.tab .address-val{overflow-wrap:anywhere}
.tab .row>span:last-child{min-width:0;overflow-wrap:anywhere}
.tab table .mono{overflow-wrap:normal;word-break:normal;white-space:nowrap}
.tab .card h2{flex-wrap:wrap}
.tab .wrap{max-width:none;padding:0 0 var(--s8)}
/* This page is forms and label/value rows, not a wall of positions: past about
   1100px the eye has to travel too far from a label to its value, so the content
   keeps a comfortable measure while its wide tables still scroll in place. The
   header is left alone so it stays full-bleed like the dashboard's. */
body .wrap > :where(.subtitle,.tabs,.tab){max-width:1180px;margin-inline:auto}
.tab .container{max-width:none;padding:0 0 var(--s8)}
@media (max-width:480px){.tabs a{padding:8px 10px;font-size:12px}}

/* ============================================================================
   Shared tab components. Scoped under .tab so the bare element selectors
   below cannot leak out and restyle the parts dashboard.css owns.
   ========================================================================= */
.tab{
  h1{font-size:22px;margin:0 0 var(--s1);color:var(--ink);font-weight:600;letter-spacing:-.01em}
  .secttl{font-size:19px;font-weight:600;margin:0 0 var(--s1);color:var(--ink);letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 var(--s5);font-size:13px;max-width:70ch;line-height:1.6}

  /* A card is a plain surface with one hairline. No gradient, no blur, no seal. */
  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
    padding:var(--s5) var(--s6);margin-bottom:var(--s4);
    box-shadow:0 1px 2px var(--shadow);
  }
  .card h2{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:0 0 var(--s3);display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;font-weight:600;
  }
  .card-title{
    display:flex;align-items:center;gap:var(--s2);font-size:12px;font-weight:600;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s4);
  }
  .card-title span{
    margin-left:auto;font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;
    color:var(--faint)!important;float:none!important;font-size:11px;
  }

  .row{
    display:flex;justify-content:space-between;gap:var(--s4);padding:7px 0;
    border-bottom:1px solid var(--rule-soft);font-size:14px;flex-wrap:wrap;
  }
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)}
  .mono{font-family:var(--mono);font-size:13px;word-break:break-all}
  .big{font-size:30px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-family:var(--mono)}
  .big.ok{color:var(--pos)} .big.bad{color:var(--neg)}
  .ok{color:var(--pos)} .warn{color:var(--warn)} .bad{color:var(--neg)}
  .muted{color:var(--muted)} .cyan{color:var(--cyan)} .gold{color:var(--cyan)}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6}
  .fine{font-size:12.5px;color:var(--muted);line-height:1.6}
  .val{font-family:var(--mono);font-size:13px;color:var(--ink)}

  /* ---- controls -------------------------------------------------------- */
  button,select,input{
    font:inherit;font-size:13.5px;border-radius:var(--r-ctl);border:1px solid var(--rule);
    background:var(--raised);color:var(--ink);padding:9px 13px;
  }
  button{font-weight:600;cursor:pointer;padding:9px 16px;transition:border-color .15s,background .15s,color .15s}
  button:hover:not([disabled]){border-color:var(--cyan);color:var(--cyan)}
  button[disabled]{opacity:.45;cursor:not-allowed}
  /* The one primary action per card: solid cyan, dark ink. */
  button.primary{border:1px solid var(--cyan);color:#04121C;background:var(--cyan);font-weight:600}
  button.primary:hover:not([disabled]){filter:brightness(1.08);color:#04121C}
  button.danger{border-color:var(--neg);color:var(--neg);background:var(--neg-dim)}
  button.danger:hover:not([disabled]){border-color:var(--neg);color:var(--neg);filter:brightness(1.1)}
  .actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s3)}
  input[type=password]{width:260px;max-width:100%}
  input::placeholder{color:var(--faint)}
  input:focus,select:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px var(--cyan-dim)}
  label.chk{display:flex;gap:var(--s2);align-items:flex-start;margin-top:var(--s3);font-size:14px;cursor:pointer;line-height:1.5}
  label.chk input{margin-top:4px}

  /* A status line always carries words, never colour alone. */
  [data-id="status"],[data-id="setupstatus"],#status,#setupstatus{min-height:22px;margin-top:var(--s3);font-size:13.5px}

  .pill{
    display:inline-block;padding:2px 9px;border-radius:var(--r-pill);border:1px solid var(--rule);
    font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);
  }
  .pill.ok{border-color:var(--green-line);color:var(--pos);background:var(--pos-dim)}
  .pill.bad{border-color:var(--red-line);color:var(--neg);background:var(--neg-dim)}
  .pill.warn{border-color:rgba(255,181,71,.34);color:var(--warn);background:var(--warn-dim)}

  details{margin-top:var(--s2);font-size:13px;color:var(--muted)}
  summary{cursor:pointer;color:var(--ink)}
  summary:hover{color:var(--cyan)}
  pre{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--rule-soft);padding:var(--s3);border-radius:var(--r-ctl);color:var(--muted)}
  ul{margin:var(--s2) 0 0 18px;padding:0} li{margin:4px 0}
  a{color:var(--cyan)}

  /* ---- tables: a header rule, hairline rows, figures in mono ----------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--rule);white-space:nowrap;
  }
  td{padding:9px var(--s3) 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top;color:var(--ink)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--raised)}
  td a{color:var(--cyan);text-decoration:none}
  td a:hover{text-decoration:underline}
  /* Wide tables scroll inside their own box; the page itself never does. */
  .tablewrap{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:var(--r-ctl);padding:0 var(--s3)}
  .health{font-size:12px;cursor:help;border-bottom:1px dotted var(--rule)}

  /* Percentage / range presets: Sell and Mint both use these. */
  .pcts{display:inline-flex;gap:6px;flex-wrap:wrap}
  .pcts button{padding:6px 10px;font-size:12px}
  .pcts button.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
  .amountrow{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}

  .abar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)}
  .approve{margin-top:var(--s2)}
  .approve summary{cursor:pointer;font-weight:600;color:var(--ink);padding:var(--s1) 0}
  .approve > div{padding-top:var(--s2)}
  .approve h3{font-size:15px;margin:var(--s2) 0 var(--s1);color:var(--ink);font-weight:600}
}
/* Approval rows hold long addresses and wrap; the vault statement does not. */
#sec-approvals td{white-space:normal}

/* ============================================================================
   Vault tab. The token-bound account's own artwork stays (it is real, read
   from the contract); the vault-door dial and gold plating around it do not.
   ========================================================================= */
#sec-vault{
  .header{display:none}     /* the site header above serves this tab too */
  .container{max-width:none;margin:0;padding:0 0 var(--s8)}

  .masthead{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;padding:0 0 var(--s4)}
  .masthead h1{font-family:var(--sans);font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink);line-height:1.2;margin:0}
  .masthead h1 em{font-style:normal;color:var(--cyan);font-weight:600}
  .masthead .est{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:var(--s1)}
  .masthead .est b{color:var(--ink);font-weight:600}
  .seal{display:flex;gap:var(--s2);flex-wrap:wrap}
  .seal span{
    font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--muted);
    padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--rule);background:var(--raised);
  }
  .seal span b{color:var(--ink);font-weight:600;font-family:var(--mono)}
  .seal span.gold{color:var(--cyan);border-color:var(--gold-line);background:var(--cyan-dim)}
  .connect-btn{
    font-family:var(--sans);font-size:13px;font-weight:600;color:#04121C;cursor:pointer;
    border:1px solid var(--cyan);border-radius:var(--r-ctl);padding:9px 16px;background:var(--cyan);
    transition:filter .15s;white-space:nowrap;
  }
  .connect-btn:hover{filter:brightness(1.08)}

  /* ---- the account's artwork and addresses ----------------------------- */
  .vhero{display:grid;grid-template-columns:200px 1fr;gap:var(--s6);align-items:center}
  .nft-image{
    width:200px;height:200px;border-radius:var(--r-card);overflow:hidden;background:var(--bg);
    border:1px solid var(--rule);
  }
  .nft-image svg{width:100%;height:100%;display:block}
  .nft-info{flex:1;min-width:0}
  .nft-name{font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:var(--s2);line-height:1.2}
  .nft-name span{color:var(--cyan)!important;font-style:normal;font-weight:600}
  .nft-badge{
    display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--r-pill);
    font-size:12px;font-weight:600;margin-bottom:var(--s4);border:1px solid var(--rule);
  }
  /* A dot plus a word: the badge never relies on its colour alone. */
  .nft-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .badge-owner{background:var(--pos-dim);color:var(--pos);border-color:var(--green-line)}
  .badge-readonly{background:var(--neg-dim);color:var(--neg);border-color:var(--red-line)}
  .badge-connecting{background:var(--warn-dim);color:var(--warn);border-color:rgba(255,181,71,.34)}
  .address-row{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--rule-soft)}
  .address-label{font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--muted);width:96px;flex:none}
  /* The full address stays reachable: it is in the title and the copy button. */
  .address-val{font-family:var(--mono);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .copy-btn{
    background:var(--raised);border:1px solid var(--rule);border-radius:6px;color:var(--muted);cursor:pointer;
    font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;flex:none;
  }
  .copy-btn:hover{color:var(--cyan);border-color:var(--cyan)}

  /* ---- balances -------------------------------------------------------- */
  .total-value{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:2px;line-height:1.2}
  .balance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
  .balance-item{
    background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-ctl);padding:var(--s3) var(--s3);
    transition:border-color .15s;min-width:0;
  }
  .balance-item:hover{border-color:var(--cyan)}
  .balance-symbol{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .balance-amount{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
  .balance-usd{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* ---- split control --------------------------------------------------- */
  .split-display{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--cyan);margin-bottom:var(--s3)}
  .slider-wrap{margin-bottom:var(--s4)}
  input[type="range"]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--rule);outline:none;margin-bottom:var(--s2);padding:0;border:0}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--cyan);cursor:pointer;border:3px solid var(--bg)}
  input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--cyan);cursor:pointer;border:3px solid var(--bg)}
  input[type="range"]:focus-visible{box-shadow:0 0 0 3px var(--cyan-dim)}
  .slider-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  /* The script toggles this to display:block, so it cannot depend on flex. */
  .warning-box{
    display:none;background:var(--warn-dim);border:1px solid rgba(255,181,71,.34);
    border-radius:var(--r-ctl);padding:var(--s2) var(--s3);font-size:12.5px;color:var(--warn);margin-bottom:var(--s3);
  }
  .warning-box svg{vertical-align:-3px;margin-right:6px}

  /* ---- forms ----------------------------------------------------------- */
  .form-row{margin-bottom:var(--s3)}
  .form-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .form-input{
    width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-ctl);padding:9px 12px;
    font-family:var(--mono);font-size:13px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .form-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
  .form-input::placeholder{color:var(--faint)}
  select.form-input{cursor:pointer}
  select.form-input option{background:var(--raised)}
  .input-with-max{display:flex;gap:var(--s2)}
  .input-with-max .form-input{flex:1;min-width:0}
  .max-btn{
    background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-ctl);padding:8px 12px;
    font-family:var(--mono);font-size:11.5px;color:var(--cyan);cursor:pointer;flex:none;
  }
  .max-btn:hover{border-color:var(--cyan)}

  /* ---- buttons --------------------------------------------------------- */
  .btn{
    width:100%;margin-top:var(--s1);padding:11px 20px;border-radius:var(--r-ctl);border:1px solid transparent;
    font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s,border-color .15s;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{color:#04121C;background:var(--cyan);border-color:var(--cyan)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn-gold{color:#04121C;background:var(--cyan);border-color:var(--cyan)}
  .btn-gold:hover:not(:disabled){filter:brightness(1.08)}
  .btn-danger{color:var(--neg);background:var(--neg-dim);border-color:var(--red-line)}
  .btn-danger:hover:not(:disabled){filter:brightness(1.1)}

  /* ---- status ---------------------------------------------------------- */
  .status-msg{margin-top:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-ctl);font-size:12.5px;font-family:var(--mono);display:none}
  .status-success{background:var(--pos-dim);color:var(--pos);border:1px solid var(--green-line)}
  .status-error{background:var(--neg-dim);color:var(--neg);border:1px solid var(--red-line)}
  .status-pending{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(255,181,71,.34)}

  /* ---- statement table ------------------------------------------------- */
  th{color:var(--muted);border-bottom-color:var(--rule);padding:var(--s2) var(--s3);font-size:11px}
  td{padding:9px var(--s3);border-bottom:1px solid var(--rule-soft);font-family:var(--mono);color:var(--ink);white-space:nowrap;vertical-align:middle}
  tbody tr:nth-child(even) td{background:rgba(41,217,255,.02)}
  .empty-state{text-align:center;padding:var(--s8);color:var(--muted);font-family:var(--sans);font-style:normal;font-size:14px;line-height:1.7}

  /* ---- info grid, loading, locked -------------------------------------- */
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4);margin-bottom:var(--s4)}
  .kv .k{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .kv .val{font-family:var(--mono);font-size:13px;color:var(--ink);overflow-wrap:anywhere}
  /* Reserve the row's height before the number arrives: no layout shift. */
  .skeleton{background:linear-gradient(90deg,var(--raised) 25%,var(--card) 50%,var(--raised) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;height:20px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .locked-overlay{
    display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;padding:var(--s6);
    color:var(--muted);font-size:13px;border:1px dashed var(--rule);border-radius:var(--r-ctl);background:var(--raised);
  }
  .locked-overlay .lock-icon{color:var(--muted);line-height:0}
  .note{font-size:12px;color:var(--muted)}
}

/* ============================================================================
   Sell tab
   ========================================================================= */
#sec-sell{
  label{display:inline-flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap}
  .tokinfo{display:flex;gap:var(--s4);flex-wrap:wrap;margin:var(--s2) 0 2px;font-size:13px;color:var(--muted)}
  .tokinfo b{color:var(--ink);font-family:var(--mono)}
